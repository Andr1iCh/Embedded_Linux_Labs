# Дозволяємо вхід за відкритим SSH-ключем.
PubkeyAuthentication yes
# Вимикаємо пароль і парольні запити через keyboard-interactive.
PasswordAuthentication no
KbdInteractiveAuthentication no
# Забороняємо віддалений вхід під root.
PermitRootLogin no
# Дозволяємо локальне перенаправлення лише до вебпанелі на цій платі.
AllowTcpForwarding local
PermitOpen 127.0.0.1:8001
